spring.application.name=ai

# ===== AI 大模型（硅基流动 SiliconFlow，OpenAI 兼容接口）=====
# 1. 注册并创建密钥：https://cloud.siliconflow.cn -> 左侧「API 密钥」-> 新建密钥
# 2. 本地运行：在 IDEA「运行/调试配置」->「环境变量」中添加：SILICONFLOW_API_KEY=你的sk密钥
# 3. 切勿把真实 sk 密钥写进本文件或提交到 Git
spring.ai.openai.api-key=${SILICONFLOW_API_KEY}
spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.chat.options.model=Qwen/Qwen2.5-7B-Instruct

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/ai_kb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JWT（生产环境请替换为足够长的随机字符串）=====
jwt.secret=your-very-long-random-secret-key-please-change-this-1234567890
jwt.expiration=86400000

# ===== 文件上传 =====
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
upload.dir=D:/ai/uploads
