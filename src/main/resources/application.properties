spring.application.name=ai


spring.ai.openai.api-key=${SILICONFLOW_API_KEY}
spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.chat.options.model=Qwen/Qwen2.5-7B-Instruct
# MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/ai_kb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===== JWT ?? =====
jwt.secret=your-very-long-random-secret-key-please-change-this-1234567890
jwt.expiration=86400000

# ????????????? 1MB?????
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# ???????????????????????
upload.dir=D:/ai/uploads

# ===== 切片 =====
chunk.size=500
chunk.overlap=100

# ===== 向量化（Python 服务）=====
vectorize.base-url=http://localhost:8000
vectorize.batch-size=16
vectorize.expected-dimension=1024

# ===== Milvus 向量库（Zilliz Cloud · Free · eu-central-1）=====
milvus.uri=https://in03-ba85acd5e09110f.serverless.aws-eu-central-1.cloud.zilliz.com:443
# 格式：<集群用户名>:<密码>，从控制台 "Download User and Password" 获取
milvus.token=${MILVUS_TOKEN:}
milvus.collection=zhihui_chunk
milvus.metric=COSINE

# ===== 检索（M4）=====
search.default-topk=5
search.max-topk=20
search.max-query-length=500
# 绝对分数阈值：默认 0 即关闭。M3 实测相关 0.55~0.60、无关 0.31，严禁设高于 0.5
search.min-score=0

# ===== RAG 问答（M4 Step2）=====
qa.temperature=0.2
qa.max-context-chars=3000
# SSE 异步请求超时（Spring MVC async）
spring.mvc.async.request-timeout=120000

# ===== 多轮会话（M4 Step4）=====
# 注入 Prompt 的最近轮数（1 轮 = user + assistant）
chat.history.max-rounds=3
# 历史对话总字符上限，超出按整条丢弃
chat.history.max-chars=1200

# ===== 混合检索 + Rerank（M4 Step5）=====
# vector / keyword / hybrid，请求可覆盖
search.mode=hybrid
rerank.enabled=true
rerank.base-url=https://api.siliconflow.cn
rerank.model=BAAI/bge-reranker-v2-m3
# 精排候选数（同时作为融合前的召回条数下限）
rerank.max-candidates=20
rerank.timeout-ms=8000

# ===== Agent 网关（M5 Step4）=====
agent.base-url=http://127.0.0.1:8100
# 与 Python 图的总超时对齐，Java 稍晚收尾并降级
agent.timeout-ms=20000
agent.max-tool-calls=1
# false 时 /agent/chat 直接走本地 /qa/ask 降级
agent.enabled=true