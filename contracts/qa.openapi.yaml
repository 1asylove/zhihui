openapi: 3.0.3
info:
  title: RAG 问答接口（非流式）
  version: 0.1.0
  description: 「智汇」知识问答：检索 TopK 片段 → 拼 Prompt → 生成带引用的回答

servers:
  - url: http://localhost:8080

paths:
  /qa/ask:
    post:
      summary: 基于知识库回答问题（需要 chat:ask 权限）
      description: |
        复用 POST /search 的检索结果拼接受控 Prompt，调用大模型生成回答。
        引用编号 = citations 数组下标 + 1（citations[0] 对应 [1]）。
        检索无命中时不调用模型，直接返回固定提示与空 citations。
        带 sessionId 时按会话追问，最近 3 轮对话会注入 Prompt；省略则自动新建会话。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QaRequest'
      responses:
        '200':
          description: 回答与引用片段
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultQaResponse'
        '400':
          description: question 为空 / 超长 / 请求体缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 向量化失败或大模型调用失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '503':
          description: 向量库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 未登录或 token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Forbidden:
      description: 无 chat:ask 权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'

  schemas:
    QaRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: 用户问题，去首尾空白后不可为空，长度 ≤ search.max-query-length（默认 500）
          example: 制度由哪个部门负责解释
        topK:
          type: integer
          description: 检索片段数，缺省 5，夹紧到 [1, 20]
          minimum: 1
          maximum: 20
          default: 5
        sessionId:
          type: integer
          format: int64
          description: |
            会话 id。省略或为 null 时自动新建会话（title 取问题前 30 字）；
            传入时会校验属主，不存在/已删除/非本人会话返回 404。

    QaCitation:
      type: object
      description: 引用片段；数组下标 + 1 即回答中的 [n] 标号
      properties:
        documentId:
          type: integer
          format: int64
        chunkIndex:
          type: integer
        fileName:
          type: string
        score:
          type: number
          format: double
        content:
          type: string

    QaResponse:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
          description: 本次问答所属会话 id（自动新建或沿用请求值）
        question:
          type: string
        answer:
          type: string
          description: 模型回答；无命中时为固定提示，不含编造内容
        citations:
          type: array
          items:
            $ref: '#/components/schemas/QaCitation'
        tookMs:
          type: integer
          format: int64
          description: 服务端总耗时（检索 + 生成）

    ResultQaResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: 成功
        data:
          $ref: '#/components/schemas/QaResponse'

    Result:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
