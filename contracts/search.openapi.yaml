openapi: 3.0.3
info:
  title: 知识检索接口
  version: 0.1.0
  description: 「智汇」平台 RAG 检索：向量召回 + 关键词召回 → RRF 融合 → Rerank 精排

servers:
  - url: http://localhost:8080

paths:
  /search:
    post:
      summary: 知识检索（需要 chat:ask 权限）
      description: |
        三种模式（请求 mode 可覆盖，缺省取 search.mode）：
        - vector：bge-m3 向量化 → Milvus COSINE TopN
        - keyword：MySQL ngram 全文索引 TopN
        - hybrid（默认）：两路召回 → RRF 融合 → bge-reranker-v2-m3 精排
        向量与关键词均按权限过滤：ADMIN 全量，USER 仅自己上传的文档。
        无命中返回 200 + 空数组，不返回 404；rerank 失败自动降级为融合排序
        （响应 reranked=false），不影响主流程。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: 检索结果（无命中时 hits 为空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSearchResponse'
        '400':
          description: query 为空 / 超长 / mode 非法 / 请求体缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 向量化服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '503':
          description: 向量库（Milvus / Zilliz）不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 未登录或 token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Forbidden:
      description: 无 chat:ask 权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'

  schemas:
    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: 用户问题，去首尾空白后不可为空，长度 ≤ search.max-query-length（默认 500）
          example: 制度由哪个部门负责解释
        topK:
          type: integer
          description: 返回条数，缺省 5，夹紧到 [1, 20]
          minimum: 1
          maximum: 20
          default: 5
        mode:
          type: string
          enum: [vector, keyword, hybrid]
          description: 检索模式，缺省取 search.mode（默认 hybrid）

    SearchHit:
      type: object
      properties:
        documentId:
          type: integer
          format: int64
          description: 来源文档 id
        chunkIndex:
          type: integer
          description: 片段序号，从 0 开始
        fileName:
          type: string
          description: 来源文件名（回表 document 取得）
        score:
          type: number
          format: double
          description: |
            排序分数，语义随模式变化：vector=余弦相似度；keyword=全文相关度；
            hybrid 未精排=RRF 分；精排后=rerank relevance_score。仅用于排序与展示，不用于过滤
          example: 0.5984
        content:
          type: string
          description: 片段原文

    SearchResponse:
      type: object
      properties:
        query:
          type: string
        topK:
          type: integer
        mode:
          type: string
          enum: [vector, keyword, hybrid]
          description: 实际使用的检索模式（hybrid 因关键词失败降级时返回 vector）
        reranked:
          type: boolean
          description: 是否经过 rerank 精排；false 表示未开启或精排失败已降级
        tookMs:
          type: integer
          format: int64
          description: 服务端检索总耗时（毫秒）
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'

    ResultSearchResponse:
      type: object
      properties:
        code:
          type: integer
          description: 200 成功；400 参数非法；502 向量化失败；503 向量库不可用
          example: 200
        message:
          type: string
          example: 成功
        data:
          allOf:
            - $ref: '#/components/schemas/SearchResponse'

    Result:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
