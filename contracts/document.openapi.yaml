openapi: 3.0.3
info:
  title: 文档上传解析接口
  version: 0.1.0

paths:
  /documents/upload:
    post:
      summary: '上传文档并解析为纯文本'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: '返回解析结果'
          content:
            text/plain:
              schema:
                type: string

  /documents/{filename}:
    delete:
      summary: 删除已上传文档（需要 doc:delete 权限）
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除结果
          content:
            text/plain:
              schema:
                type: string
              example: 已删除：t2.txt
        '401':
          description: 未登录或 token 失效
        '403':
          description: 缺少 doc:delete 权限