server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 history 路由：非真实文件的路径回退到 index.html，交给 vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（前端全部走相对路径，无需 /api 前缀）
    location ~ ^/(auth|sessions|agent|qa|search|documents|charts)(/|$) {
        proxy_pass http://java:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE（/qa/stream）：关缓冲、清 Connection、长超时，否则流式输出被整段攒住
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传上限与后端 20MB 对齐
    client_max_body_size 20m;
}
